<form (ngSubmit)="onSubmit()">
  <label for="name">Nom :</label>
  <input id="name" [(ngModel)]="competition.name" name="name" required />

  <label for="date">Date :</label>
  <input id="date" [(ngModel)]="competition.date" name="date" type="date" required />

  <button type="submit">Créer</button>
</form>
